# "GitHub Actions continuous integration pipeline."
# "Automates uv environment setup, ruff linting, and docker build verification."
name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync Backend Dependencies
        working-directory: ./backend
        run: uv sync

      - name: Sync Frontend Dependencies
        working-directory: ./frontend
        run: uv sync

      - name: Run Ruff Linting (Backend)
        working-directory: ./backend
        run: uvx ruff check .

      - name: Run Ruff Linting (Frontend)
        working-directory: ./frontend
        run: uvx ruff check .

      - name: Verify Docker Compose Build
        run: docker compose build